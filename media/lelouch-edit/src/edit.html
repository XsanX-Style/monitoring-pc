<meta charset="utf-8">
<title>XSANX LELOUCH EDIT</title>
<link rel="stylesheet" href="local-fonts.css">
<style>
:root{--red:#ff1f2e;--paper:#f6f6f6;--lime:#a8ff45;--violet:#9b86ff;--cyan:#35dfe0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;overflow:hidden;background:#000}
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
#root{position:relative;width:1080px;height:1080px;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform,filter;overflow:hidden}
#shot{position:absolute;left:50%;top:50%;width:1080px;height:1080px;margin:-540px 0 0 -540px;transform-origin:50% 50%;will-change:transform}
#shotB{position:absolute;left:50%;top:50%;width:1080px;height:1080px;margin:-540px 0 0 -540px;transform-origin:50% 50%;
       mix-blend-mode:screen;opacity:0;will-change:transform}

#fx{position:absolute;inset:0;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 40%,rgba(0,0,0,.42) 78%,rgba(0,0,0,.88) 100%)}
#scan{position:absolute;inset:0;opacity:.10;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.10) 0 1px,rgba(0,0,0,0) 1px 3px)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;mix-blend-mode:screen}
#redflash{position:absolute;inset:0;background:var(--red);opacity:0;mix-blend-mode:screen}
#bars{position:absolute;inset:0;opacity:0}
#bars i{position:absolute;left:-4%;width:108%;display:block;backdrop-filter:invert(1) contrast(1.2)}
#black{position:absolute;inset:0;background:#000;opacity:0}

/* intro */
#intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;
       background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.72) 18%, rgba(0,0,0,.38) 52%, rgba(0,0,0,0) 78%)}
#in-by{font:700 30px 'Inter';letter-spacing:.85em;text-indent:.85em;color:#fff;margin-bottom:26px;text-shadow:0 4px 26px rgba(0,0,0,.9)}
#in-name{font-family:'Montserrat';font-weight:800;font-size:172px;letter-spacing:.05em;text-indent:.05em;color:#fff;line-height:1}
#in-rule{height:4px;width:0;background:var(--red);margin-top:46px;box-shadow:0 0 26px rgba(255,31,46,.7)}

/* label chip for project shots */
#lab{position:absolute;left:0;right:0;bottom:56px;text-align:center;opacity:0}
#lab .k{display:inline-block;padding:14px 30px;border-radius:999px;background:rgba(0,0,0,.72);
        border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);
        font:800 26px 'Inter';letter-spacing:.32em;text-indent:.32em;color:#fff;text-transform:uppercase}
#lab .k b{font-weight:800}
#lab.lime .k{border-color:rgba(168,255,69,.6);color:#dcffb4;box-shadow:0 0 40px rgba(168,255,69,.25)}
#lab.vio .k{border-color:rgba(155,134,255,.6);color:#ddd6ff;box-shadow:0 0 40px rgba(124,92,255,.28)}

/* finale */
#fin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;background:rgba(0,0,0,.74)}
#fin .row{display:flex;align-items:center;gap:26px;margin-bottom:16px}
#fin .mk{width:86px;height:86px;border-radius:26px;display:grid;place-items:center;font-family:'Montserrat';font-weight:800;font-size:44px}
#fin .mk.a{background:linear-gradient(150deg,#c9ff86,#a8ff45 45%,#6de516);color:#0a1204}
#fin .mk.b{background:linear-gradient(150deg,#35dfe0,#7c5cff 62%,#4a39c8);color:#061018}
#fin .nm{font-family:'Montserrat';font-weight:800;font-size:68px;color:#fff;line-height:1}
#fin .nm em{font-style:normal}
#fin .lnk{margin-top:8px;font:700 25px 'Inter';letter-spacing:.06em;color:#b9c0cc}
#fin-bar{height:5px;width:0;background:var(--red);margin:34px 0}
#fin-by{font-family:'Montserrat';font-weight:800;font-size:92px;letter-spacing:.06em;text-indent:.06em;color:#fff}
#fin-tag{margin-top:16px;font:700 21px 'Inter';letter-spacing:.5em;text-indent:.5em;color:#9aa0ac;text-transform:uppercase}
</style>

<div id="root">
  <div id="stage">
    <img id="shot" src="">
    <img id="shotB" src="">
  </div>
  <div id="intro">
    <div id="in-by">by</div>
    <div id="in-name">XSANX</div>
    <div id="in-rule"></div>
  </div>
  <div id="lab"><span class="k" id="lab-t"></span></div>
  <div id="fin">
    <div class="row"><div class="mk a">X</div><div><div class="nm">X-STYLE <em>CRM</em></div><div class="lnk">x-style-crm.vercel.app</div></div></div>
    <div class="row"><div class="mk b">S</div><div><div class="nm">SMS <em>HUB</em></div><div class="lnk">sms-tg-forwarder.vercel.app</div></div></div>
    <div id="fin-bar"></div>
    <div id="fin-by">XSANX</div>
    <div id="fin-tag">делаю продукты под ключ</div>
  </div>
  <div id="fx">
    <div id="scan"></div><div id="vig"></div>
    <div id="bars"><i></i><i></i><i></i></div>
    <div id="flash"></div><div id="redflash"></div><div id="black"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t,0,1),3);
const eoq=t=>1-Math.pow(1-clamp(t,0,1),5);
const eio=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const prand=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const pad=(n,w)=>String(n).padStart(w,'0');

/* beat grid: 134.5 BPM */
const P=0.446, PH=0.430;
const B=k=>PH+k*P;

/* ---------------- cut list ----------------
   src: 'l' lelouch (60fps, 1297 frames) | 'm' me (60fps, 228) | prefix for project stills
   ss : start second inside the source
   sp : playback speed                                                              */
const CUTS=[
 {t0:0.000,t1:B(0),  src:'l', ss:0.00, sp:1.0, z:[1.18,1.10], dark:0.55},
 {t0:B(0), t1:B(2),  src:'l', ss:0.45, sp:1.0, z:[1.14,1.02]},
 {t0:B(2), t1:B(4),  src:'l', ss:1.35, sp:1.0, z:[1.02,1.14]},
 {t0:B(4), t1:B(5),  src:'m', ss:2.30, sp:1.0, z:[1.20,1.06], grade:'me'},
 {t0:B(5), t1:B(7),  src:'l', ss:2.70, sp:1.0, z:[1.12,1.02]},
 {t0:B(7), t1:B(9),  src:'l', ss:3.95, sp:1.0, z:[1.04,1.16]},
 {t0:B(9), t1:B(10), src:'x1',ss:0.00, sp:0.7, grade:'proj', z:[1.05,0.99]},
 {t0:B(10),t1:B(12), src:'l', ss:5.00, sp:1.0, z:[1.14,1.02]},
 {t0:B(12),t1:B(13), src:'m', ss:0.30, sp:1.0, z:[1.06,1.18], grade:'me'},
 {t0:B(13),t1:B(15), src:'l', ss:6.40, sp:1.0, z:[1.02,1.14]},
 {t0:B(15),t1:B(16), src:'x2',ss:0.00, sp:0.7, grade:'proj', z:[1.04,0.99], lab:'живые данные', labc:'lime'},
 {t0:B(16),t1:B(18), src:'l', ss:8.00, sp:1.0, z:[1.16,1.03]},
 {t0:B(18),t1:B(19), src:'s1',ss:0.00, sp:1.0, grade:'proj', z:[1.05,0.99], lab:'SMS HUB', labc:'vio'},
 {t0:B(19),t1:B(21), src:'l', ss:9.40, sp:0.55,z:[1.04,1.24]},
 {t0:B(21),t1:B(22), src:'m', ss:2.55, sp:1.0, z:[1.18,1.06], grade:'me'},
 {t0:B(22),t1:B(24), src:'l', ss:10.05,sp:1.0, z:[1.14,1.02]},
 {t0:B(24),t1:B(25), src:'x3',ss:0.00, sp:0.7, grade:'proj', z:[1.04,0.99], lab:'воронка сделок', labc:'lime'},
 {t0:B(25),t1:B(27), src:'l', ss:12.00,sp:1.0, z:[1.03,1.15]},
 {t0:B(27),t1:B(28), src:'s2',ss:0.00, sp:1.0, grade:'proj', z:[1.05,0.99], lab:'sms → telegram', labc:'vio'},
 {t0:B(28),t1:B(30), src:'l', ss:13.00,sp:1.0, z:[1.16,1.03]},
 {t0:B(30),t1:B(31), src:'m', ss:1.10, sp:1.0, z:[1.06,1.20], grade:'me'},
 {t0:B(31),t1:B(33), src:'l', ss:14.40,sp:1.0, z:[1.02,1.14]},
 {t0:B(33),t1:B(35), src:'l', ss:15.40,sp:1.0, z:[1.14,1.02]},
 {t0:B(35),t1:B(36), src:'s3',ss:0.00, sp:1.0, grade:'proj', z:[1.04,0.99], lab:'код за секунду', labc:'vio'},
 {t0:B(36),t1:B(38), src:'l', ss:16.90,sp:1.0, z:[1.04,1.16]},
 {t0:B(38),t1:B(40), src:'l', ss:17.40,sp:0.75,z:[1.16,1.04]},
 {t0:B(40),t1:B(42), src:'l', ss:18.40,sp:1.0, z:[1.03,1.15]},
 {t0:B(42),t1:B(44), src:'l', ss:19.40,sp:1.0, z:[1.14,1.02]},
 {t0:B(44),t1:21.62, src:'l', ss:20.30,sp:0.6, z:[1.10,1.20], dark:0.55, fin:true}
];
const SRCN={l:1297,m:228};
function cutAt(t){ for(let i=CUTS.length-1;i>=0;i--) if(t>=CUTS[i].t0) return CUTS[i]; return CUTS[0]; }
function srcFor(c,t){
  const u=(t-c.t0)*c.sp;
  if(c.src==='l') return 'src/lelouch/l_'+pad(clamp(Math.round((c.ss+u)*60)+1,1,SRCN.l),4)+'.jpg';
  if(c.src==='m') return 'src/me/m_'+pad(clamp(Math.round((c.ss+u)*60)+1,1,SRCN.m),4)+'.jpg';
  return 'src/proj/'+c.src+'_'+pad(clamp(Math.round(u*60)+1,1,30),2)+'.jpg';
}

async function renderFrame(t){
  const c=cutAt(t);
  const u=t-c.t0, p=clamp(u/(c.t1-c.t0),0,1);
  const src=srcFor(c,t);
  const img=$('shot');
  if(img.getAttribute('src')!==src){ img.setAttribute('src',src); try{ await img.decode(); }catch(e){} }

  /* beat energy */
  const k=(t-PH)/P, ki=Math.floor(k), ph=k-ki;
  const strong=((((ki%2)+2)%2)===0)?1:0.5;
  const amp=t>=PH-0.02?Math.exp(-6.4*ph)*strong:0.25*Math.exp(-6*Math.abs(t-PH));
  const cutAge=u, cutHit=Math.exp(-14*cutAge);

  /* shot transform: continuous zoom + beat punch */
  const z=lerp(c.z[0],c.z[1],eio(p))*(1+0.045*amp+0.05*cutHit);
  const sx=(prand(ki*3+Math.floor(t*13))*2-1)*9*amp;
  const sy=(prand(ki*7+5+Math.floor(t*13))*2-1)*9*amp;
  const rot=(prand(ki*11+9)*2-1)*0.6*amp;
  img.style.transform=`scale(${z.toFixed(4)}) translate(${sx.toFixed(2)}px,${sy.toFixed(2)}px) rotate(${rot.toFixed(3)}deg)`;

  /* chromatic split on hits, via a screen-blended red copy */
  const ab=Math.max(amp*0.9, cutHit);
  const b2=$('shotB');
  if(ab>0.12){
    if(b2.getAttribute('src')!==src){ b2.setAttribute('src',src); }
    b2.style.opacity=(0.34*ab).toFixed(3);
    b2.style.transform=`scale(${(z*1.006).toFixed(4)}) translate(${(sx+10*ab).toFixed(2)}px,${sy.toFixed(2)}px)`;
    b2.style.filter='sepia(1) saturate(6) hue-rotate(-25deg)';
  } else b2.style.opacity='0';

  const grade = c.grade==='me'
    ? `contrast(${(1.24+0.10*amp).toFixed(3)}) saturate(0.55) brightness(${(1.06+0.05*amp).toFixed(3)})`
    : c.grade==='proj'
    ? `contrast(${(1.06+0.08*amp).toFixed(3)}) saturate(1.12) brightness(${(1.20+0.05*amp).toFixed(3)})`
    : `contrast(${(1.07+0.10*amp).toFixed(3)}) saturate(1.06) brightness(${(1+0.05*amp).toFixed(3)})`;
  $('stage').style.filter=grade;

  /* intro title */
  const iv=$('intro');
  if(t<1.45){
    const a=clamp(t/0.18,0,1)*clamp(1-(t-1.15)/0.3,0,1);
    iv.style.opacity=a.toFixed(3);
    const ap=eoq(t/0.5);
    $('in-name').style.letterSpacing=lerp(0.28,0.05,ap).toFixed(3)+'em';
    $('in-name').style.textIndent=lerp(0.28,0.05,ap).toFixed(3)+'em';
    const g=Math.max(0,1-((t*1000)%220)/70);
    $('in-name').style.textShadow=`${(-11*g-4*amp).toFixed(1)}px 0 rgba(0,220,255,.9), ${(11*g+4*amp).toFixed(1)}px 0 rgba(255,31,46,.95)`;
    $('in-by').style.opacity=eo((t-0.12)/0.3).toFixed(3);
    $('in-rule').style.width=(eoq((t-0.2)/0.7)*520).toFixed(0)+'px';
  } else iv.style.opacity='0';

  /* project label */
  const lab=$('lab');
  if(c.lab){
    const a=eoq(u/0.1)*clamp(1-(u-(c.t1-c.t0-0.08))/0.08,0,1);
    lab.style.opacity=a.toFixed(3);
    lab.className=c.labc||'';
    $('lab-t').textContent=c.lab;
    lab.style.transform=`translateY(${((1-a)*20).toFixed(1)}px) scale(${lerp(1.06,1,eoq(u/0.16)).toFixed(3)})`;
  } else lab.style.opacity='0';

  /* finale card */
  const fin=$('fin');
  if(c.fin){
    const a=eoq(u/0.22);
    fin.style.opacity=a.toFixed(3);
    fin.style.transform=`scale(${lerp(1.10,1.0,eoq(u/0.5)).toFixed(4)})`;
    $('fin-bar').style.width=(eoq((u-0.25)/0.5)*520).toFixed(0)+'px';
    const b=eoq((u-0.42)/0.35);
    $('fin-by').style.opacity=b.toFixed(3);
    $('fin-by').style.letterSpacing=lerp(0.26,0.06,b).toFixed(3)+'em';
    $('fin-by').style.textIndent=lerp(0.26,0.06,b).toFixed(3)+'em';
    $('fin-tag').style.opacity=eo((u-0.8)/0.4).toFixed(3);
  } else fin.style.opacity='0';

  /* flashes, glitch, darkening */
  $('flash').style.opacity=clamp(0.085*amp*strong+0.34*Math.exp(-52*cutAge),0,0.6).toFixed(3);
  $('redflash').style.opacity=clamp((strong>0.9?0.1*amp:0)+(c.src==='m'?0.30*Math.exp(-30*cutAge):0),0,0.4).toFixed(3);
  const bars=$('bars');
  if(cutAge<0.06||amp>0.92){
    bars.style.opacity='1';
    for(let i=0;i<bars.children.length;i++){
      const r1=prand(Math.floor(t*120)+i*17), r2=prand(Math.floor(t*120)+i*31+3);
      const el=bars.children[i];
      el.style.top=(r1*100).toFixed(1)+'%';
      el.style.height=(2+r2*22).toFixed(1)+'px';
      el.style.transform=`translateX(${((r2*2-1)*44).toFixed(1)}px)`;
    }
  } else bars.style.opacity='0';
  $('black').style.opacity=((c.fin?0.45:(c.dark?c.dark*(1-eo(p*1.4)):0))+(t<0.1?1-t/0.1:0)+(t>21.45?clamp((t-21.45)/0.17,0,1):0)).toFixed(3);
  $('scan').style.opacity=(0.07+0.05*amp).toFixed(3);
}
window.renderFrame=renderFrame;
(async()=>{ try{ await document.fonts.ready; }catch(_){}
  await renderFrame(0); window.__ready=true; })();
</script>
