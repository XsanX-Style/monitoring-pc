<meta charset="utf-8">
<title>X-STYLE CRM EDIT</title>
<link rel="stylesheet" href="local-fonts.css">
<style>
:root{
  --bg:#030604; --panel:#080d09; --g:#a8ff45; --g2:#6de516;
  --paper:#f5f8f4; --muted:#8e978f; --line:rgba(168,255,69,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;overflow:hidden;background:#000}
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
#root{position:relative;width:1080px;height:1080px;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform;background:var(--bg)}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.scene.on{display:block}
.inner{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform,opacity}
img{display:block}

/* ---------- FX ---------- */
#fx{position:absolute;inset:0;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 40%, rgba(0,0,0,.34) 78%, rgba(0,0,0,.86) 100%)}
#scan{position:absolute;inset:0;opacity:.14;background:repeating-linear-gradient(to bottom, rgba(168,255,69,.09) 0 1px, rgba(0,0,0,0) 1px 3px)}
#flash{position:absolute;inset:0;background:#eaffd6;opacity:0;mix-blend-mode:screen}
#gflash{position:absolute;inset:0;background:var(--g);opacity:0;mix-blend-mode:screen}
#bars{position:absolute;inset:0;opacity:0}
#bars i{position:absolute;left:-4%;width:108%;display:block;backdrop-filter:brightness(2.6) saturate(1.5) contrast(1.15)}
#edge{position:absolute;inset:0;opacity:0;box-shadow:inset 0 0 0 4px rgba(168,255,69,.75), inset 0 0 90px rgba(168,255,69,.25)}

/* ---------- type ---------- */
.slam{font-family:'Oswald';font-weight:700;color:var(--paper);text-transform:uppercase;line-height:.94}
.acc{color:var(--g)}

/* ---------- intro ---------- */
#sc-intro .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#i-by{font:600 26px 'Inter';letter-spacing:.85em;color:#b7c4b2;text-indent:.85em;margin-bottom:22px}
#i-name{font-family:'Montserrat';font-weight:800;font-size:168px;letter-spacing:.06em;color:#fff;text-indent:.06em;line-height:1}
#i-rule{height:3px;background:linear-gradient(90deg,transparent,var(--g) 18%,var(--g) 82%,transparent);margin-top:26px;width:0}
#i-sub{margin-top:26px;font:600 19px 'Inter';letter-spacing:.62em;color:#7f8b7c;text-indent:.62em;opacity:0}
#i-glitch{position:absolute;inset:0;opacity:0;display:flex;align-items:center;justify-content:center;
          font-family:'Montserrat';font-weight:800;font-size:168px;letter-spacing:.06em;color:var(--g);mix-blend-mode:screen}

/* ---------- hook ---------- */
#sc-hook .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 80px;text-align:center}
#h-text{font-size:118px}
#h-note{margin-top:34px;font:500 22px 'Inter';letter-spacing:.36em;color:#6f7a6d;text-transform:uppercase;text-indent:.36em}

/* ---------- X mark ---------- */
.xmark{position:relative;display:block}
.xmark i{position:absolute;left:50%;top:50%;width:13%;height:116%;background:linear-gradient(180deg,#c9ff86,var(--g) 45%,var(--g2));
         border-radius:5px;transform-origin:50% 50%;box-shadow:0 0 40px rgba(168,255,69,.85), 0 0 110px rgba(168,255,69,.45)}
.xmark i:nth-child(1){transform:translate(-50%,-50%) rotate(28deg)}
.xmark i:nth-child(2){transform:translate(-50%,-50%) rotate(-28deg)}
.xmark b{display:none}

/* ---------- logo ---------- */
#sc-logo .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#lg-x{width:250px;height:250px;margin-bottom:26px}
#lg-name{font-family:'Montserrat';font-weight:800;font-size:132px;line-height:.92;letter-spacing:.01em;color:#fff}
#lg-crm{font-family:'Montserrat';font-weight:800;font-size:132px;line-height:.92;color:var(--g);margin-top:2px}
#lg-sub{margin-top:34px;font-family:'Oswald';font-weight:700;font-size:40px;letter-spacing:.16em;color:#d6ded2;text-transform:uppercase;opacity:0}

/* ---------- slam ---------- */
#sc-slam .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 74px;text-align:center}
#sl-kick{font:700 21px 'Inter';letter-spacing:.6em;color:var(--g);text-indent:.6em;margin-bottom:32px;text-transform:uppercase}
#sl-text{font-size:126px}
#sl-sub{margin-top:36px;font:500 25px 'Inter';letter-spacing:.24em;color:#8b958a;text-transform:uppercase;text-indent:.24em}
#sl-rule{position:absolute;left:50%;bottom:148px;transform:translateX(-50%);height:4px;width:0;background:var(--g)}

/* ---------- shot (real screenshots) ---------- */
.shotwrap{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
.shotwrap img{position:absolute;transform-origin:0 0;will-change:transform;filter:saturate(1.1) contrast(1.06) brightness(1.24)}
.shotgrad{position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(to top,rgba(3,6,4,.94),rgba(3,6,4,0))}
.shotgrad.soft{height:24%;background:linear-gradient(to top,rgba(3,6,4,.78),rgba(3,6,4,0))}
.shotgrad.top{top:0;bottom:auto;height:26%;background:linear-gradient(to bottom,rgba(3,6,4,.9),rgba(3,6,4,0))}
.shotlab{position:absolute;left:56px;bottom:62px;right:56px}
.shotlab.kick{top:118px;bottom:auto}
.shotlab span{display:block;font:700 19px 'Inter';letter-spacing:.42em;color:var(--g);text-transform:uppercase;text-indent:.42em}
.shotlab b{display:block;margin-top:12px;font-family:'Oswald';font-weight:700;font-size:62px;color:#fff;text-transform:uppercase;letter-spacing:.02em;line-height:1.02}
.shotmark{position:absolute;right:52px;top:48px;display:flex;align-items:center;gap:12px;
          font:700 16px 'Inter';letter-spacing:.3em;color:rgba(245,248,244,.72);text-transform:uppercase}
.shotmark i{width:26px;height:26px;position:relative;display:block}
.beam{position:absolute;left:0;right:0;height:200px;background:linear-gradient(to bottom,rgba(168,255,69,0),rgba(168,255,69,.10),rgba(168,255,69,0));mix-blend-mode:screen}

/* ---------- phone ---------- */
#sc-ph .deck{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:44px}
.dev{position:relative;width:404px;height:866px;border-radius:52px;background:#050806;padding:11px;
     box-shadow:0 50px 130px rgba(0,0,0,.9), 0 0 0 2px rgba(168,255,69,.22), 0 0 90px rgba(168,255,69,.12);flex:none}
.dev .scr{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:#000}
.dev .scr img{position:absolute;left:0;top:0;width:100%;transform-origin:50% 0;filter:saturate(1.1) contrast(1.05) brightness(1.22)}
.dev .notch{position:absolute;left:50%;top:20px;transform:translateX(-50%);width:112px;height:28px;border-radius:16px;background:#050806;z-index:3}
#sc-ph .cap{position:absolute;left:0;right:0;bottom:52px;text-align:center;font-family:'Oswald';font-weight:700;font-size:52px;
            color:#fff;text-transform:uppercase;letter-spacing:.08em;text-shadow:0 8px 40px rgba(0,0,0,.9)}
#sc-ph .kick{position:absolute;left:0;right:0;top:56px;text-align:center;font:700 19px 'Inter';letter-spacing:.46em;color:var(--g);text-transform:uppercase;text-indent:.46em}

/* ---------- split ---------- */
#sc-split .half{position:absolute;top:0;bottom:0;width:50%;overflow:hidden}
#sc-split .lft{left:0}#sc-split .rgt{right:0}
#sc-split .half img{position:absolute;transform-origin:0 0;filter:saturate(1.1) contrast(1.05) brightness(1.22)}
#sc-split .lbl{position:absolute;left:0;right:0;bottom:64px;text-align:center;font-family:'Oswald';font-weight:700;font-size:46px;color:#fff;
               letter-spacing:.1em;text-transform:uppercase;text-shadow:0 6px 30px rgba(0,0,0,.95)}
#sc-split .divider{position:absolute;left:50%;top:0;bottom:0;width:5px;background:var(--g);transform:translateX(-50%);box-shadow:0 0 40px rgba(168,255,69,.6)}
#sc-split .shade{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(to top,rgba(3,6,4,.95),rgba(3,6,4,0))}

/* ---------- cta ---------- */
#sc-cta .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#c-x{width:170px;height:170px;margin-bottom:30px}
#c-1{font-family:'Montserrat';font-weight:800;font-size:104px;color:#fff;line-height:1;letter-spacing:.01em;text-align:center}
#c-1 em{font-style:normal;color:var(--g)}
#c-2{margin-top:26px;font-family:'Oswald';font-weight:700;font-size:46px;color:#dfe7db;text-transform:uppercase;letter-spacing:.1em;text-align:center;line-height:1.2}
#c-bar{height:6px;width:0;background:var(--g);margin-top:34px;box-shadow:0 0 30px rgba(168,255,69,.7)}

/* ---------- end ---------- */
#sc-end .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#e-x{width:196px;height:196px;margin-bottom:28px}
#e-name{font-family:'Montserrat';font-weight:800;font-size:120px;letter-spacing:.05em;text-indent:.05em;color:#fff;line-height:1}
#e-links{margin-top:30px;display:flex;flex-direction:column;gap:12px;align-items:center;opacity:0}
#e-links span{font:600 27px 'Inter';letter-spacing:.14em;color:var(--g)}
#e-by{margin-top:34px;font:700 21px 'Inter';letter-spacing:.5em;color:#93a08e;text-transform:uppercase;text-indent:.5em;opacity:0}
</style>

<div id="root">
  <div id="stage">

    <div class="scene" id="sc-intro"><div class="inner">
      <div class="wrap">
        <div id="i-by">by</div>
        <div id="i-name">XSANX</div>
        <div id="i-rule"></div>
        <div id="i-sub">x-style business system</div>
      </div>
      <div id="i-glitch">XSANX</div>
    </div></div>

    <div class="scene" id="sc-hook"><div class="inner">
      <div class="wrap"><div class="slam" id="h-text"></div><div id="h-note"></div></div>
    </div></div>

    <div class="scene" id="sc-logo"><div class="inner">
      <div class="wrap">
        <div class="xmark" id="lg-x"><i></i><i></i><b></b></div>
        <div id="lg-name">X-STYLE</div>
        <div id="lg-crm">CRM</div>
        <div id="lg-sub">твой бизнес. твои правила.</div>
      </div>
    </div></div>

    <div class="scene" id="sc-slam"><div class="inner">
      <div class="wrap"><div id="sl-kick"></div><div class="slam" id="sl-text"></div><div id="sl-sub"></div></div>
      <div id="sl-rule"></div>
    </div></div>

    <div class="scene" id="sc-shot"><div class="inner">
      <div class="shotwrap"><img id="shot-img" src=""></div>
      <div class="shotgrad top"></div>
      <div class="shotgrad" id="shot-grad"></div>
      <div class="beam" id="shot-beam"></div>
      <div class="shotmark"><span>X-STYLE CRM</span><i class="xmark"><i></i><i></i></i></div>
      <div class="shotlab"><span id="shot-kick"></span><b id="shot-title"></b></div>
    </div></div>

    <div class="scene" id="sc-ph"><div class="inner">
      <div class="kick" id="ph-kick">telegram mini app</div>
      <div class="deck">
        <div class="dev" id="dev1"><div class="notch"></div><div class="scr"><img id="ph1" src="assets/ph_home.png"></div></div>
        <div class="dev" id="dev2"><div class="notch"></div><div class="scr"><img id="ph2" src="assets/ph_deals.png"></div></div>
      </div>
      <div class="cap" id="ph-cap">crm в кармане</div>
    </div></div>

    <div class="scene" id="sc-split"><div class="inner">
      <div class="half lft"><img id="sp-a" src="assets/ph_home.png"><div class="shade"></div><div class="lbl">telegram</div></div>
      <div class="half rgt"><img id="sp-b" src="assets/w_focus.png"><div class="shade"></div><div class="lbl">браузер</div></div>
      <div class="divider"></div>
    </div></div>

    <div class="scene" id="sc-cta"><div class="inner">
      <div class="wrap">
        <div class="xmark" id="c-x"><i></i><i></i><b></b></div>
        <div id="c-1">X-STYLE <em>CRM</em></div>
        <div id="c-2">твой бизнес. твои правила.<br>твой x-style.</div>
        <div id="c-bar"></div>
      </div>
    </div></div>

    <div class="scene" id="sc-end"><div class="inner">
      <div class="wrap">
        <div class="xmark" id="e-x"><i></i><i></i><b></b></div>
        <div id="e-name">X-STYLE</div>
        <div id="e-links"><span>x-style-bot.vercel.app</span><span>x-style-crm.vercel.app</span></div>
        <div id="e-by">by xsanx</div>
      </div>
    </div></div>

  </div>

  <div id="fx">
    <div id="scan"></div>
    <div id="vig"></div>
    <div id="bars"><i></i><i></i><i></i></div>
    <div id="edge"></div>
    <div id="flash"></div>
    <div id="gflash"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeOutQuint=t=>1-Math.pow(1-clamp(t,0,1),5);
const easeInOut=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const prand=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);};

const G0=3.18, STEP=0.22935, B=k=>G0+k*STEP;
const INTRO_ON=[0.05,0.18,0.31,0.44,0.56,0.70,0.91,1.09,1.35,1.90,2.07,2.29,2.47,2.69,2.78,2.94];

/* real screenshot sizes (px) */
const IMG={
  'assets/sq_landing.png' :[1800,1800],
  'assets/w_focus.png'    :[2160,1350],
  'assets/w_deals.png'    :[2160,1350],
  'assets/w_analytics.png':[2160,1350],
  'assets/w_clients.png'  :[2160,1350],
  'assets/ph_home.png'    :[840,1800],
  'assets/ph_deals.png'   :[840,1800],
  'assets/ph_clients.png' :[840,1800]
};

const CUES=[
 {t0:0.00,t1:1.35,s:'intro'},
 {t0:1.35,t1:1.90,s:'hook',a:'ЗАЯВКИ',b:'ТЕРЯЮТСЯ',note:'клиент написал — ответа нет'},
 {t0:1.90,t1:2.45,s:'hook',a:'КЛИЕНТЫ',b:'УХОДЯТ',note:'к тем, кто ответил первым'},
 {t0:2.45,t1:2.94,s:'hook',a:'ДЕНЬГИ',b:'УТЕКАЮТ',note:'таблицы и блокноты не считают'},
 {t0:2.94,t1:3.18,s:'hook',a:'ХВАТИТ',b:'',note:''},

 {t0:3.18, t1:B(4), s:'logo'},
 {t0:B(4), t1:B(7), s:'shot', img:'assets/sq_landing.png', lab:'kick', f0:[.15,.20,1.90], f1:[.16,.28,1.48],
   kick:'x-style-crm.vercel.app'},
 {t0:B(7), t1:B(9), s:'slam', kick:'', a:'БИЗНЕС ПОД', b:'КОНТРОЛЕМ', sub:'клиенты · сделки · деньги'},
 {t0:B(9), t1:B(12),s:'shot', img:'assets/w_focus.png', lab:'kick', f0:[.55,.168,2.15], f1:[.52,.252,1.64],
   kick:'фокус центр · живые данные'},
 {t0:B(12),t1:B(14),s:'shot', img:'assets/w_analytics.png', f0:[.44,.15,2.30], f1:[.42,.26,1.90],
   kick:'аналитика', title:'КОНВЕРСИЯ 38%<br>СРЕДНИЙ ЧЕК 139 000 ₽'},
 {t0:B(14),t1:B(16),s:'slam', kick:'', a:'КЛИЕНТЫ · СДЕЛКИ', b:'ЗАДАЧИ · ОТЧЁТЫ', sub:'всё связано между собой'},
 {t0:B(16),t1:B(19),s:'shot', img:'assets/w_deals.png', f0:[.27,.46,1.80], f1:[.64,.46,1.80],
   kick:'воронка', title:'13 СДЕЛОК · 1 497 000 ₽<br>ПЕРЕТАЩИЛ — ЭТАП СМЕНИЛСЯ'},
 {t0:B(19),t1:B(21),s:'slam', kick:'', a:'ВОРОНКА', b:'ВЕДЁТ САМА', sub:'ни одной потерянной заявки'},
 {t0:B(21),t1:B(24),s:'ph'},
 {t0:B(24),t1:B(25),s:'slam', kick:'', a:'В TELEGRAM', b:'', sub:''},
 {t0:B(25),t1:B(26),s:'slam', kick:'', a:'И В БРАУЗЕРЕ', b:'', sub:''},
 {t0:B(26),t1:B(27),s:'slam', kick:'', a:'ДАННЫЕ', b:'ОДНИ', sub:''},
 {t0:B(27),t1:B(29),s:'split'},
 {t0:B(29),t1:B(31),s:'cta'},
 {t0:B(31),t1:11.10,s:'end'}
];
const cueAt=t=>{for(let i=CUES.length-1;i>=0;i--) if(t>=CUES[i].t0) return CUES[i]; return CUES[0];};
const show=id=>document.querySelectorAll('.scene').forEach(e=>e.classList.toggle('on', e.id===id));

/* place a screenshot so that focus point (fx,fy) sits centered at given zoom */
function placeShot(img,src,f0,f1,p){
  const dim=IMG[src]||[1600,1000];
  const fx=lerp(f0[0],f1[0],p), fy=lerp(f0[1],f1[1],p), z=lerp(f0[2],f1[2],p);
  const w=1080*z, h=w*dim[1]/dim[0];
  img.style.width=w.toFixed(1)+'px';
  img.style.height=h.toFixed(1)+'px';
  img.style.left='0'; img.style.top='0';
  img.style.transform=`translate(${(540-fx*w).toFixed(1)}px, ${(540-fy*h).toFixed(1)}px)`;
}

/* ---------- scenes ---------- */
function scIntro(u,p,t){
  $('sc-intro').firstElementChild.style.transform=`scale(${lerp(1.10,1.0,easeOutQuint(u/1.5)).toFixed(4)})`;
  const nm=$('i-name'), a=easeOutQuint(u/0.42);
  nm.style.opacity=a.toFixed(3);
  nm.style.filter=`blur(${((1-a)*22).toFixed(1)}px)`;
  nm.style.letterSpacing=lerp(0.30,0.06,a).toFixed(3)+'em';
  nm.style.textIndent=lerp(0.30,0.06,a).toFixed(3)+'em';
  $('i-by').style.opacity=easeOut((u-0.12)/0.4).toFixed(3);
  $('i-rule').style.width=(easeOutQuint((u-0.30)/0.75)*620).toFixed(0)+'px';
  $('i-sub').style.opacity=easeOut((u-0.72)/0.5).toFixed(3);
  let g=0; for(const o of INTRO_ON) if(t>=o&&t<o+0.09) g=Math.max(g,1-(t-o)/0.09);
  const gl=$('i-glitch');
  gl.style.opacity=(g*0.8).toFixed(3);
  gl.style.transform=`translate(${((prand(Math.floor(t*80))*2-1)*26*g).toFixed(1)}px,${((prand(Math.floor(t*80)+3)*2-1)*6*g).toFixed(1)}px)`;
  nm.style.textShadow=g>0.05?`${(-9*g).toFixed(1)}px 0 rgba(109,229,22,.9), ${(9*g).toFixed(1)}px 0 rgba(255,255,255,.5)`:'none';
}
function scHook(u,p,c,t){
  const fin=c.a==='ХВАТИТ';
  $('h-text').innerHTML=fin?`${c.a}<span class="acc">.</span>`:(c.b?`${c.a}<br><span class="acc">${c.b}</span>`:c.a);
  $('h-note').textContent=c.note||'';
  $('h-text').style.fontSize=fin?'190px':'118px';
  const el=$('sc-hook').firstElementChild, app=easeOutQuint(u/0.16);
  const blackout=fin?clamp(1-(t-3.10)/0.05,0,1):1;
  el.style.transform=`scale(${lerp(1.0,1.09,easeInOut(p)).toFixed(4)}) translateY(${((1-app)*26).toFixed(1)}px)`;
  el.style.opacity=(app*blackout).toFixed(3);
  $('h-text').style.textShadow=fin?`${(-6*(1-easeOut(u/0.3))-2).toFixed(1)}px 0 rgba(168,255,69,.55)`:'none';
  $('h-note').style.opacity=easeOut((u-0.12)/0.3).toFixed(3);
}
function scLogo(u,p){
  const el=$('sc-logo').firstElementChild;
  el.style.transform=`scale(${lerp(1.16,1.0,easeOutQuint(u/0.4)).toFixed(4)})`;
  const a=easeOutQuint(u/0.22);
  $('lg-x').style.opacity=clamp(u/0.05,0,1).toFixed(3);
  $('lg-x').style.transform=`rotate(${lerp(-26,0,easeOutQuint(u/0.4)).toFixed(2)}deg) scale(${lerp(0.55,1,easeOutQuint(u/0.35)).toFixed(3)})`;
  ['lg-name','lg-crm'].forEach((id,i)=>{
    const b=easeOutQuint((u-0.08-i*0.05)/0.24);
    $(id).style.opacity=b.toFixed(3);
    $(id).style.letterSpacing=lerp(0.20,0.01,b).toFixed(3)+'em';
    $(id).style.textIndent=lerp(0.20,0.01,b).toFixed(3)+'em';
  });
  $('lg-sub').style.opacity=easeOut((u-0.34)/0.3).toFixed(3);
  $('lg-sub').style.letterSpacing=lerp(0.34,0.16,easeOut((u-0.34)/0.5)).toFixed(3)+'em';
}
function scSlam(u,p,c){
  $('sl-kick').textContent=c.kick||'';
  $('sl-text').innerHTML=c.b?`${c.a}<br><span class="acc">${c.b}</span>`:c.a;
  $('sl-sub').textContent=c.sub||'';
  const short=!c.b&&!c.sub;
  const longest=Math.max(c.a.length,(c.b||'').length);
  $('sl-text').style.fontSize=short?(c.a.length>9?'118px':'150px'):(longest>13?'96px':longest>10?'112px':'126px');
  const el=$('sc-slam').firstElementChild, a=easeOutQuint(u/0.14);
  el.style.transform=`scale(${lerp(1.14,1.0,a).toFixed(4)})`;
  el.style.opacity=clamp(u/0.04,0,1).toFixed(3);
  $('sl-text').style.textShadow=`${(-14*(1-a)).toFixed(1)}px 0 rgba(109,229,22,.95), ${(14*(1-a)).toFixed(1)}px 0 rgba(255,255,255,.6)`;
  $('sl-kick').style.opacity=easeOut((u-0.06)/0.18).toFixed(3);
  $('sl-sub').style.opacity=easeOut((u-0.10)/0.2).toFixed(3);
  $('sl-rule').style.width=(easeOutQuint(u/0.5)*360).toFixed(0)+'px';
}
function scShot(u,p,c){
  const img=$('shot-img');
  if(img.getAttribute('src')!==c.img) img.setAttribute('src',c.img);
  placeShot(img,c.img,c.f0,c.f1,easeInOut(p));
  const el=$('sc-shot').firstElementChild;
  el.style.opacity=clamp(u/0.035,0,1).toFixed(3);
  el.style.transform='none';
  const kickOnly = c.lab==='kick';
  $('shot-grad').classList.toggle('soft', kickOnly);
  document.querySelector('.shotlab').classList.toggle('kick', kickOnly);
  $('shot-kick').textContent=c.kick||'';
  $('shot-title').innerHTML=kickOnly?'':(c.title||'');
  $('shot-title').style.display=kickOnly?'none':'block';
  const la=easeOutQuint((u-0.06)/0.2);
  $('shot-kick').style.opacity=la.toFixed(3);
  $('shot-kick').style.letterSpacing=lerp(0.7,0.42,la).toFixed(3)+'em';
  const lb=easeOutQuint((u-0.11)/0.2);
  $('shot-title').style.opacity=lb.toFixed(3);
  $('shot-title').style.transform=`translateY(${((1-lb)*26).toFixed(1)}px)`;
  $('shot-beam').style.top=(lerp(-25,115,(u*1.35)%1)).toFixed(1)+'%';
  $('shot-beam').style.opacity=(0.85*clamp(u/0.1,0,1)).toFixed(2);
}
function scPh(u,p){
  const el=$('sc-ph').firstElementChild;
  el.style.opacity=clamp(u/0.04,0,1).toFixed(3);
  const a=easeOutQuint(u/0.4);
  el.style.transform=`scale(${lerp(1.14,0.99,a).toFixed(4)})`;
  const d1=$('dev1'), d2=$('dev2');
  d1.style.transform=`translate(${lerp(120,0,a).toFixed(1)}px, ${lerp(60,0,a).toFixed(1)}px) rotate(${lerp(8,-3.5,a).toFixed(2)}deg) scale(${lerp(0.9,1,a).toFixed(3)})`;
  d2.style.transform=`translate(${lerp(-120,0,a).toFixed(1)}px, ${lerp(70,26,a).toFixed(1)}px) rotate(${lerp(-8,3.5,a).toFixed(2)}deg) scale(${lerp(0.9,0.96,a).toFixed(3)})`;
  d1.style.opacity=clamp(u/0.06,0,1).toFixed(3);
  d2.style.opacity=easeOut((u-0.12)/0.18).toFixed(3);
  // slow scroll inside the screens
  $('ph1').style.transform=`translateY(${(-u*46).toFixed(1)}px)`;
  $('ph2').style.transform=`translateY(${(-u*30-20).toFixed(1)}px)`;
  $('ph-kick').style.opacity=easeOut(u/0.2).toFixed(3);
  $('ph-cap').style.opacity=easeOutQuint((u-0.3)/0.2).toFixed(3);
  $('ph-cap').style.letterSpacing=lerp(0.3,0.08,easeOut((u-0.3)/0.4)).toFixed(3)+'em';
}
function scSplit(u,p){
  const el=$('sc-split').firstElementChild;
  el.style.opacity=clamp(u/0.04,0,1).toFixed(3);
  const a=easeOutQuint(u/0.26);
  document.querySelector('#sc-split .lft').style.transform=`translateX(${((1-a)*-140).toFixed(1)}px)`;
  document.querySelector('#sc-split .rgt').style.transform=`translateX(${((1-a)*140).toFixed(1)}px)`;
  const A=$('sp-a'), Bm=$('sp-b');
  const wA=1080*0.86, hA=wA*1800/840;
  A.style.width=wA+'px'; A.style.height=hA+'px';
  A.style.transform=`translate(${(270-wA/2).toFixed(1)}px, ${lerp(-130,-260,easeInOut(p)).toFixed(1)}px)`;
  const wB=1080*1.55, hB=wB*1350/2160;
  Bm.style.width=wB+'px'; Bm.style.height=hB+'px';
  Bm.style.transform=`translate(${lerp(-360,-470,easeInOut(p)).toFixed(1)}px, ${(540-hB*0.46).toFixed(1)}px)`;
  el.style.transform=`scale(${lerp(1.08,1.0,a).toFixed(4)})`;
}
function scCta(u,p){
  const el=$('sc-cta').firstElementChild;
  el.style.opacity=clamp(u/0.04,0,1).toFixed(3);
  el.style.transform=`scale(${lerp(1.12,1.0,easeOutQuint(u/0.4)).toFixed(4)})`;
  const a=easeOutQuint(u/0.2);
  $('c-x').style.opacity=clamp(u/0.05,0,1).toFixed(3);
  $('c-x').style.transform=`rotate(${lerp(-20,0,a).toFixed(2)}deg) scale(${lerp(0.6,1,a).toFixed(3)})`;
  $('c-1').style.opacity=clamp(u/0.06,0,1).toFixed(3);
  $('c-1').style.textShadow=`${(-12*(1-a)).toFixed(1)}px 0 rgba(109,229,22,.9), ${(12*(1-a)).toFixed(1)}px 0 rgba(255,255,255,.55)`;
  $('c-2').style.opacity=easeOutQuint((u-0.12)/0.2).toFixed(3);
  $('c-bar').style.width=(easeOutQuint((u-0.2)/0.3)*560).toFixed(0)+'px';
}
function scEnd(u,p){
  const el=$('sc-end').firstElementChild;
  el.style.opacity=clamp(u/0.02,0,1).toFixed(3);
  el.style.transform=`scale(${(lerp(1.16,1.0,easeOutQuint(u/0.22))-clamp((u-0.3)/0.5,0,1)*0.03).toFixed(4)})`;
  const a=easeOutQuint(u/0.14);
  $('e-x').style.transform=`rotate(${lerp(-16,0,a).toFixed(2)}deg) scale(${lerp(0.7,1,a).toFixed(3)})`;
  $('e-name').style.letterSpacing=lerp(0.24,0.05,a).toFixed(3)+'em';
  $('e-name').style.textIndent=lerp(0.24,0.05,a).toFixed(3)+'em';
  $('e-name').style.textShadow=`${(-16*(1-a)).toFixed(1)}px 0 rgba(109,229,22,.95), ${(16*(1-a)).toFixed(1)}px 0 rgba(255,255,255,.6)`;
  $('e-links').style.opacity=easeOut((u-0.06)/0.14).toFixed(3);
  $('e-by').style.opacity=easeOut((u-0.18)/0.18).toFixed(3);
}

/* ---------- main ---------- */
function renderFrame(t){
  const c=cueAt(t), u=t-c.t0, p=clamp(u/(c.t1-c.t0),0,1);
  const map={intro:'sc-intro',hook:'sc-hook',logo:'sc-logo',slam:'sc-slam',shot:'sc-shot',ph:'sc-ph',split:'sc-split',cta:'sc-cta',end:'sc-end'};
  show(map[c.s]);
  if(c.s==='intro')scIntro(u,p,t);
  else if(c.s==='hook')scHook(u,p,c,t);
  else if(c.s==='logo')scLogo(u,p);
  else if(c.s==='slam')scSlam(u,p,c);
  else if(c.s==='shot')scShot(u,p,c);
  else if(c.s==='ph')scPh(u,p);
  else if(c.s==='split')scSplit(u,p);
  else if(c.s==='cta')scCta(u,p);
  else if(c.s==='end')scEnd(u,p);

  let amp=0,ki=0,strong=0.4;
  if(t>=G0-0.02){
    const k=(t-G0)/STEP; ki=Math.floor(k); const ph=k-ki;
    strong=(((ki%2)+2)%2===1)?1:0.42;
    amp=Math.exp(-6.2*ph)*strong;
  }else{
    for(let i=0;i<INTRO_ON.length;i++){const o=INTRO_ON[i];
      if(t>=o){const v=Math.exp(-9*(t-o))*(t>2.4?0.55:0.3); if(v>amp){amp=v;ki=i;}}}
  }
  const cutAge=u, cutHit=Math.exp(-16*cutAge);
  const punch=1+0.05*amp+0.048*cutHit;
  const sx=(prand(ki*3+Math.floor(t*13))*2-1)*8*amp;
  const sy=(prand(ki*7+5+Math.floor(t*13))*2-1)*8*amp;
  const rot=(prand(ki*11+9)*2-1)*0.5*amp;
  $('stage').style.transform=`scale(${punch.toFixed(4)}) translate(${sx.toFixed(2)}px,${sy.toFixed(2)}px) rotate(${rot.toFixed(3)}deg)`;
  $('stage').style.filter=`contrast(${(1.05+0.09*amp).toFixed(3)}) brightness(${(1+0.05*amp).toFixed(3)})`;

  const wf=0.075*amp*strong+0.30*Math.exp(-55*cutAge)*(t>=G0?1:0.2)+(t>=G0&&t<G0+0.05?0.55*(1-(t-G0)/0.05):0);
  $('flash').style.opacity=clamp(wf,0,0.7).toFixed(3);
  const gf=(t>=G0&&strong>0.9)?0.10*amp:0;
  $('gflash').style.opacity=clamp(gf+(t>=G0&&t<G0+0.05?0.30*(1-(t-G0)/0.05):0),0,0.4).toFixed(3);
  $('edge').style.opacity=(t>=G0?clamp(0.55*amp*strong,0,0.55):0).toFixed(3);

  const bars=$('bars');
  if((cutAge<0.07&&t>=G0)||amp>0.9){
    bars.style.opacity='1';
    for(let i=0;i<bars.children.length;i++){
      const r1=prand(Math.floor(t*120)+i*17), r2=prand(Math.floor(t*120)+i*31+3);
      const k=bars.children[i];
      k.style.top=(r1*100).toFixed(1)+'%';
      k.style.height=(2+r2*26).toFixed(1)+'px';
      k.style.transform=`translateX(${((r2*2-1)*40).toFixed(1)}px)`;
    }
  } else bars.style.opacity='0';
  $('scan').style.opacity=(t<G0?0.18:0.09+0.05*amp).toFixed(3);
}
window.renderFrame=renderFrame;
// preload every screenshot before the shooter starts
(async()=>{
  await Promise.all(Object.keys(IMG).map(src=>new Promise(res=>{
    const im=new Image(); im.onload=()=>im.decode?im.decode().then(res).catch(res):res(); im.onerror=res; im.src=src;
  })));
  try{ await document.fonts.ready; }catch(_){}
  renderFrame(0);
  window.__ready=true;
})();
</script>
